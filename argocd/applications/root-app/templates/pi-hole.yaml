
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pihole
  namespace: argocd
spec:
  project: default
  info:   
     - name: "Description"
       value: "PiHole"
  source:
    repoURL: https://mojo2600.github.io/pihole-kubernetes/  # chart repo
    chart: pihole # chart name
    targetRevision: 2.30.0 # chart version
    helm:
      values: |
        # https://github.com/MoJo2600/pihole-kubernetes/tree/main/charts/pihole
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: pihole
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true